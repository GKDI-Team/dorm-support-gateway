openapi: 3.0.3
info:
  title: DormSupport Public API
  version: 0.1.0
  description: Public MVP API exposed through the Gateway.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Gateway health
      responses:
        '200': { description: Gateway is available }
  /api/v1/admin/users:
    post:
      summary: Create a user account
      security:
        - BearerAuth: []
      responses:
        '201': { description: User account created }
        '401': { description: Missing, invalid or expired JWT }
        '403': { description: Administrator role required }
        '409': { description: Login already exists }
  /api/v1/auth/login:
    post:
      summary: Login
      responses: { '200': { description: JWT access token created } }
  /api/v1/auth/me:
    get:
      summary: Current user
      security:
        - BearerAuth: []
      responses: { '200': { description: User profile } }
  /api/v1/categories:
    get:
      summary: List issue categories
      responses: { '200': { description: Categories } }
  /api/v1/issues:
    get:
      summary: List issues
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Issues }
        '401': { description: Missing, invalid or expired JWT }
    post:
      summary: Create issue
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Issue created }
        '401': { description: Missing, invalid or expired JWT }
        '403': { description: Resident role required }
  /api/v1/issues/{issueId}:
    get:
      summary: Get issue
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Issue details }
        '401': { description: Missing, invalid or expired JWT }
        '404': { description: Issue not found }
  /api/v1/issues/{issueId}/status:
    patch:
      summary: Change issue status
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Status changed }
        '401': { description: Missing, invalid or expired JWT }
        '403': { description: Reviewer or administrator role required }
        '404': { description: Issue not found }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
